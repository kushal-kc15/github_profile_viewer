<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Profile Search</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; min-height: 100vh; padding: 40px 20px; }
  .container { max-width: 720px; margin: 0 auto; }

  .search-box { display: flex; gap: 8px; margin-bottom: 24px; }
  .search-box input { flex: 1; padding: 10px 14px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 15px; outline: none; }
  .search-box input:focus { border-color: #58a6ff; }
  .search-box button { padding: 10px 20px; background: #238636; border: none; border-radius: 6px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .search-box button:hover { background: #2ea043; }
  .search-box button:disabled { opacity: .5; cursor: default; }

  .error { color: #f85149; font-size: 13px; margin-bottom: 16px; display: none; }

  .profile { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 20px; display: none; }
  .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .profile-header img { width: 64px; height: 64px; border-radius: 50%; }
  .profile-header h2 { font-size: 20px; font-weight: 600; }
  .profile-header a { color: #58a6ff; font-size: 14px; text-decoration: none; }
  .bio { color: #8b949e; font-size: 14px; margin-bottom: 14px; }
  .stats { display: flex; gap: 24px; padding-top: 12px; border-top: 1px solid #21262d; font-size: 14px; color: #8b949e; }
  .stats strong { color: #e6edf3; }

  .repos-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: none; }
  .repos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .repos { grid-template-columns: 1fr; } }

  .repo { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; }
  .repo-name { color: #58a6ff; font-size: 14px; font-weight: 600; text-decoration: none; margin-bottom: 6px; }
  .repo-desc { color: #8b949e; font-size: 13px; flex: 1; margin-bottom: 10px; }
  .repo-meta { display: flex; gap: 16px; font-size: 12px; color: #8b949e; padding-top: 8px; border-top: 1px solid #21262d; }
  .repo-meta .stars { color: #e3b341; }
</style>
</head>
<body>
<div class="container">

  <div class="search-box">
    <input type="text" id="q" placeholder="Enter a GitHub username...">
    <button id="btn">Search</button>
  </div>
  <div class="error" id="err"></div>

  <div class="profile" id="profile">
    <div class="profile-header">
      <img id="avatar" src="" alt="">
      <div>
        <h2 id="name"></h2>
        <a id="link" href="#" target="_blank"></a>
      </div>
    </div>
    <div class="bio" id="bio"></div>
    <div class="stats">
      <span><strong id="repoCount"></strong> repos</span>
      <span><strong id="followers"></strong> followers</span>
    </div>
  </div>

  <div class="repos-title" id="reposTitle">Repositories</div>
  <div class="repos" id="repos"></div>

</div>
<script>
const API = "https://github-profile-viewer-bay.vercel.app/api/";
const input = document.getElementById("q");
const btn   = document.getElementById("btn");
const err   = document.getElementById("err");

input.addEventListener("keydown", e => { if (e.key === "Enter") btn.click(); });

btn.addEventListener("click", async () => {
  const q = input.value.trim();
  if (!q) return;

  err.style.display = "none";
  document.getElementById("profile").style.display = "none";
  document.getElementById("reposTitle").style.display = "none";
  document.getElementById("repos").innerHTML = "";
  btn.disabled = true;
  btn.textContent = "Searching...";

  try {
    const res  = await fetch(API + "?q=" + encodeURIComponent(q));
    const data = await res.json();

    if (!data.profile) {
      err.textContent = "User not found.";
      err.style.display = "block";
      return;
    }

    const p = data.profile;
    document.getElementById("avatar").src             = p.avatar_url;
    document.getElementById("name").textContent       = p.name || p.username;
    document.getElementById("link").textContent       = "@" + p.username;
    document.getElementById("link").href              = p.html_url;
    document.getElementById("bio").textContent        = p.bio || "No bio provided.";
    document.getElementById("repoCount").textContent  = p.public_repos;
    document.getElementById("followers").textContent  = p.followers.toLocaleString();
    document.getElementById("profile").style.display  = "block";

    const list = document.getElementById("repos");
    for (const r of data.repos) {
      list.innerHTML += `<div class="repo">
        <a class="repo-name" href="${r.html_url}" target="_blank">${r.name}</a>
        <div class="repo-desc">${r.description || "No description."}</div>
        <div class="repo-meta">
          <span>${r.language || "n/a"}</span>
          <span class="stars">★ ${r.stars}</span>
        </div>
      </div>`;
    }
    if (data.repos.length) document.getElementById("reposTitle").style.display = "block";

  } catch (e) {
    err.textContent = "Could not reach the server. Is it running?";
    err.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.textContent = "Search";
  }
});
</script>
</body>
</html>
